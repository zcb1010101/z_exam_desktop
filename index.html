<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>大斌考试桌面系统</title>
    <meta name="description" content="简约大气的考试倒计时桌面应用，支持全屏显示、自定义背景和考试守则" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --text: #f8fafc;
            --text-dim: #cbd5e1;
            --text-faint: rgba(248, 250, 252, 0.6);
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.16);
        }

        html, body { height: 100%; }

        body {
            font-family: system-ui, "Segoe UI", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text);
            background: #0b1120;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .app {
            position: relative;
            min-height: 100vh;
            width: 100%;
            background-size: cover;
            background-position: center;
            transition: background-image 0.4s ease;
        }

        .scrim {
            position: absolute;
            inset: 0;
            background: rgba(2, 6, 23, 0.55);
        }

        .app.plain .scrim { display: none; }

        .page {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 24px 32px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .welcome { color: var(--text-faint); font-size: 17px; font-weight: 500; }

        .actions { display: flex; gap: 12px; }

        .icon-btn {
            width: 40px; height: 40px;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 9999px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: var(--text);
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: background 0.2s, transform 0.2s;
        }
        .icon-btn:hover { background: rgba(255, 255, 255, 0.18); transform: scale(1.06); }
        .icon-btn svg { width: 20px; height: 20px; }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            max-width: 960px;
            width: 100%;
            margin: 0 auto;
            padding: 16px 0;
        }

        .section-label {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            color: var(--text-dim);
            font-size: 18px; font-weight: 500;
        }
        .section-label svg { width: 22px; height: 22px; }

        #subject {
            margin-top: 12px;
            text-align: center;
            font-size: min(var(--fs-subject, 80px), 9vw);
            color: var(--c-subject, #ffffff);
            font-weight: 700;
            letter-spacing: 0.08em;
            line-height: 1.1;
        }

        .datetime {
            display: flex; align-items: center; gap: 14px;
            color: var(--text-dim);
        }
        .datetime svg { width: 20px; height: 20px; }
        .datetime .date { font-size: 22px; font-weight: 500; color: var(--c-time, var(--text-dim)); }
        .datetime .time {
            font-size: min(var(--fs-time, 30px), 4vw);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--c-time, var(--text-dim));
        }

        .times {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            width: 100%;
            max-width: 720px;
        }

        .card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            backdrop-filter: blur(12px);
            padding: 22px 24px;
        }

        .card .time-value {
            margin-top: 10px;
            text-align: center;
            font-size: 34px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .countdown-card {
            width: 100%;
            padding: 40px 24px;
            border-radius: 28px;
            background:
                linear-gradient(120deg, rgba(59, 130, 246, 0.18), rgba(168, 85, 247, 0.18)),
                var(--glass);
            border: 1px solid var(--glass-border);
        }

        #status { font-size: 26px; font-weight: 500; }

        #countdown {
            margin-top: 16px;
            text-align: center;
            font-size: min(var(--fs-countdown, 128px), 12vw);
            font-weight: 700;
            letter-spacing: 0.04em;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            color: var(--c-countdown, #ffffff);
        }

        .rules-card { width: 100%; max-width: 720px; padding: 20px 28px; }
        .rules-card ol { margin-top: 12px; padding-left: 22px; display: grid; gap: 6px; }
        .rules-card li { color: var(--text-dim); font-size: 15px; line-height: 1.6; }

        footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: var(--text-faint);
            font-size: 13px;
            padding-bottom: 4px;
        }
        footer a {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--text-faint); text-decoration: none;
            transition: color 0.2s;
        }
        footer a:hover { color: #fff; }
        footer svg { width: 16px; height: 16px; }

        /* ---------- 设置弹窗 ---------- */
        .modal-backdrop {
            position: fixed; inset: 0; z-index: 50;
            background: rgba(2, 6, 23, 0.7);
            backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            padding: 24px;
        }
        .modal-backdrop[hidden] { display: none; }

        .modal {
            width: min(520px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            background: #101828;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 28px;
            display: flex; flex-direction: column; gap: 18px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
        }
        .modal h2 { font-size: 20px; font-weight: 600; }

        .field { display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: var(--text-dim); }
        .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        input[type="text"], input[type="datetime-local"], textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 10px;
            color: var(--text);
            padding: 10px 12px;
            font-size: 14px;
            font-family: inherit;
            color-scheme: dark;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus { border-color: #3b82f6; }
        textarea { resize: vertical; line-height: 1.6; }

        .swatches { display: flex; gap: 10px; }
        .swatch {
            width: 44px; height: 44px;
            border-radius: 12px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.15s, border-color 0.15s;
        }
        .swatch:hover { transform: scale(1.08); }
        .swatch.active { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25); }

        .bg-actions { display: flex; gap: 10px; }
        .bg-preview {
            height: 80px; border-radius: 10px;
            background-size: cover; background-position: center;
            border: 1px solid rgba(255, 255, 255, 0.14);
        }

        .style-group { display: flex; flex-direction: column; gap: 10px; }
        .style-row {
            display: grid;
            grid-template-columns: 64px 1fr 52px 34px;
            align-items: center;
            gap: 10px;
        }
        .style-row .style-name { font-size: 13px; color: var(--text-dim); }
        .style-row .style-value {
            font-size: 12px; color: var(--text-faint);
            text-align: right; font-variant-numeric: tabular-nums;
        }
        .style-row input[type="range"] { accent-color: #3b82f6; width: 100%; }
        .style-row input[type="color"] {
            width: 34px; height: 28px; padding: 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px; background: none; cursor: pointer;
        }

        .check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-dim); cursor: pointer; }
        .check input { accent-color: #3b82f6; width: 16px; height: 16px; }

        .modal-foot { display: flex; justify-content: flex-end; gap: 12px; margin-top: 4px; }
        .btn {
            padding: 10px 22px;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: filter 0.2s, background 0.2s;
        }
        .btn.primary { background: #3b82f6; color: #fff; }
        .btn.primary:hover { filter: brightness(1.1); }
        .btn.ghost { background: transparent; color: var(--text-dim); border-color: rgba(255, 255, 255, 0.16); }
        .btn.ghost:hover { background: rgba(255, 255, 255, 0.08); }

        .toast {
            position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%);
            background: rgba(16, 24, 40, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: var(--text);
            padding: 10px 22px;
            border-radius: 9999px;
            font-size: 14px;
            z-index: 60;
            animation: toast-in 0.25s ease;
        }
        @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }

        @media (max-width: 640px) {
            .times { grid-template-columns: 1fr; }
            .field-row { grid-template-columns: 1fr; }
            .page { padding: 16px; }
        }

        /* 矮屏适配：压缩留白与字号，保证守则卡片完整可见 */
        @media (max-height: 840px) {
            main { gap: 14px; }
            #subject { font-size: min(var(--fs-subject, 80px), 6vw); }
            .datetime .time { font-size: min(var(--fs-time, 30px), 3.2vw); }
            .card .time-value { font-size: 26px; margin-top: 6px; }
            .countdown-card { padding: 24px; }
            #countdown { font-size: min(var(--fs-countdown, 128px), 8.5vw); }
            .rules-card ol { margin-top: 8px; }
        }
    </style>
</head>

<body>
    <div class="app" id="app">
        <div class="scrim"></div>
        <div class="page">
            <header>
                <div class="welcome">欢迎使用大斌考试桌面系统</div>
                <div class="actions">
                    <button id="btnSettings" class="icon-btn" aria-label="设置" title="设置">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                    <button id="btnFullscreen" class="icon-btn" aria-label="全屏" title="全屏">
                        <svg id="icoMax" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/>
                            <line x1="21" x2="14" y1="3" y2="10"/><line x1="3" x2="10" y1="21" y2="14"/>
                        </svg>
                        <svg id="icoMin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                            <polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/>
                            <line x1="14" x2="21" y1="10" y2="3"/><line x1="3" x2="10" y1="21" y2="14"/>
                        </svg>
                    </button>
                </div>
            </header>

            <main>
                <section>
                    <div class="section-label">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>
                        </svg>
                        <span>考试科目</span>
                    </div>
                    <h1 id="subject">数学</h1>
                </section>

                <div class="datetime">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                    </svg>
                    <span class="date" id="dateNow">----/--/--</span>
                    <span class="time" id="timeNow">--:--:--</span>
                </div>

                <div class="times">
                    <div class="card">
                        <div class="section-label">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>
                            </svg>
                            <span>开始时间</span>
                        </div>
                        <div class="time-value" id="startAt">--:--</div>
                    </div>
                    <div class="card">
                        <div class="section-label">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>
                            </svg>
                            <span>结束时间</span>
                        </div>
                        <div class="time-value" id="endAt">--:--</div>
                    </div>
                </div>

                <div class="countdown-card">
                    <div class="section-label">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                        </svg>
                        <span id="status">尚未配置考试时间</span>
                    </div>
                    <div id="countdown">--:--:--</div>
                </div>

                <section class="card rules-card" id="rulesCard">
                    <div class="section-label">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/>
                            <line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/>
                        </svg>
                        <span>考试守则</span>
                    </div>
                    <ol id="rules"></ol>
                </section>
            </main>

            <footer>
                <div>2026 © zcb1010101. All rights reserved.</div>
                <a href="https://github.com/zcb1010101" target="_blank" rel="noopener noreferrer">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/>
                        <path d="M9 18c-4.51 2-5-2-7-2"/>
                    </svg>
                    <span>GitHub</span>
                </a>
            </footer>
        </div>
    </div>

    <div class="modal-backdrop" id="modal" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <h2 id="modalTitle">考试设置</h2>
            <label class="field">考试科目
                <input type="text" id="fSubject" placeholder="例如：数学" />
            </label>
            <div class="field-row">
                <label class="field">开始时间
                    <input type="datetime-local" id="fStart" />
                </label>
                <label class="field">结束时间
                    <input type="datetime-local" id="fEnd" />
                </label>
            </div>
            <div class="field">背景
                <div class="swatches" id="swatches"></div>
                <div class="bg-actions">
                    <button type="button" class="btn ghost" id="btnUpload">上传图片…</button>
                    <button type="button" class="btn ghost" id="btnClearBg">恢复默认</button>
                </div>
                <input type="file" id="fImage" accept="image/*" hidden />
                <div class="bg-preview" id="bgPreview" hidden></div>
            </div>
            <div class="field">字体样式
                <div class="style-group" id="styleGroup">
                    <div class="style-row">
                        <span class="style-name">考试科目</span>
                        <input type="range" id="fSubjectSize" min="32" max="160" step="2" />
                        <span class="style-value" id="vSubjectSize"></span>
                        <input type="color" id="fSubjectColor" title="科目字体颜色" />
                    </div>
                    <div class="style-row">
                        <span class="style-name">时间</span>
                        <input type="range" id="fTimeSize" min="14" max="64" step="1" />
                        <span class="style-value" id="vTimeSize"></span>
                        <input type="color" id="fTimeColor" title="时间字体颜色" />
                    </div>
                    <div class="style-row">
                        <span class="style-name">倒计时</span>
                        <input type="range" id="fCountSize" min="48" max="256" step="2" />
                        <span class="style-value" id="vCountSize"></span>
                        <input type="color" id="fCountColor" title="倒计时字体颜色" />
                    </div>
                </div>
                <div class="bg-actions">
                    <button type="button" class="btn ghost" id="btnResetStyle">恢复默认样式</button>
                </div>
            </div>
            <label class="field">考试守则（每行一条）
                <textarea id="fRules" rows="5" placeholder="每行写一条守则"></textarea>
            </label>
            <label class="check"><input type="checkbox" id="fShowRules" /> 在页面上显示考试守则</label>
            <div class="modal-foot">
                <button type="button" class="btn ghost" id="btnCancel">取消</button>
                <button type="button" class="btn primary" id="btnSave">保存</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast" hidden>已保存</div>

    <script>
        (function () {
            'use strict';

            var LS_KEY = 'exam-desktop-config-v1';

            var GRADIENTS = {
                slate: { name: '深空', css: 'radial-gradient(1100px 500px at 75% -10%, rgba(59,130,246,.18), transparent 60%), radial-gradient(900px 500px at 15% 110%, rgba(168,85,247,.14), transparent 60%), linear-gradient(135deg, #0b1120 0%, #1e293b 50%, #0b1120 100%)' },
                ocean: { name: '深海', css: 'radial-gradient(1100px 500px at 75% -10%, rgba(34,211,238,.16), transparent 60%), linear-gradient(135deg, #041c26 0%, #0b3a4a 50%, #041c26 100%)' },
                violet: { name: '极光', css: 'radial-gradient(1100px 500px at 70% -10%, rgba(139,92,246,.22), transparent 60%), linear-gradient(135deg, #150f2e 0%, #2d1b52 50%, #150f2e 100%)' },
                ember: { name: '朝霞', css: 'radial-gradient(1100px 500px at 75% -10%, rgba(251,113,133,.18), transparent 60%), linear-gradient(135deg, #1c0f16 0%, #3b1622 50%, #1c0f16 100%)' }
            };

            var DEFAULT_CONFIG = {
                subject: '数学',
                start: '',
                end: '',
                background: { type: 'gradient', id: 'slate', image: null },
                rules: [
                    '提前 10 分钟进入考场，对号入座',
                    '只允许携带必要的文具入场',
                    '手机等电子设备关机并放在指定位置',
                    '独立完成答卷，不得交头接耳',
                    '考试结束铃响立即停笔，等待收卷'
                ],
                showRules: true,
                typography: {
                    subject: { size: 80, color: '#ffffff' },
                    time: { size: 30, color: '#cbd5e1' },
                    countdown: { size: 128, color: '#ffffff' }
                }
            };

            var state = load();
            var draft = null;

            function load() {
                try {
                    var raw = localStorage.getItem(LS_KEY);
                    if (!raw) return clone(DEFAULT_CONFIG);
                    var saved = JSON.parse(raw);
                    var cfg = clone(DEFAULT_CONFIG);
                    Object.keys(DEFAULT_CONFIG).forEach(function (k) {
                        if (saved[k] !== undefined) cfg[k] = saved[k];
                    });
                    if (!cfg.background || typeof cfg.background !== 'object') cfg.background = clone(DEFAULT_CONFIG.background);
                    if (!Array.isArray(cfg.rules)) cfg.rules = clone(DEFAULT_CONFIG.rules);
                    if (!cfg.typography || typeof cfg.typography !== 'object') {
                        cfg.typography = clone(DEFAULT_CONFIG.typography);
                    } else {
                        ['subject', 'time', 'countdown'].forEach(function (k) {
                            var d = DEFAULT_CONFIG.typography[k];
                            cfg.typography[k] = Object.assign({}, d, cfg.typography[k] || {});
                            cfg.typography[k].size = Number(cfg.typography[k].size) || d.size;
                        });
                    }
                    return cfg;
                } catch (e) {
                    return clone(DEFAULT_CONFIG);
                }
            }

            function persist() {
                try {
                    localStorage.setItem(LS_KEY, JSON.stringify(state));
                } catch (e) {
                    alert('保存失败：本地存储空间不足，请更换较小的背景图片。');
                }
            }

            function clone(o) { return JSON.parse(JSON.stringify(o)); }
            function pad(n) { return String(n).padStart(2, '0'); }

            // ---------- 渲染 ----------
            var app = document.getElementById('app');
            var rulesCard = document.getElementById('rulesCard');

            function applyBackground() {
                var bg = state.background;
                if (bg.type === 'image' && bg.image) {
                    app.style.backgroundImage = 'url("' + bg.image + '")';
                    app.classList.remove('plain');
                } else {
                    var g = GRADIENTS[bg.id] || GRADIENTS.slate;
                    app.style.backgroundImage = g.css;
                    app.classList.add('plain');
                }
            }

            function renderRules() {
                var ol = document.getElementById('rules');
                ol.innerHTML = '';
                state.rules.forEach(function (r) {
                    var li = document.createElement('li');
                    li.textContent = r;
                    ol.appendChild(li);
                });
                rulesCard.style.display = (state.showRules && state.rules.length) ? '' : 'none';
            }

            function fmtDateTime(d) {
                return pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
            }

            function fmtCountdown(ms) {
                ms = Math.max(0, ms);
                var d = Math.floor(ms / 864e5);
                var h = Math.floor(ms % 864e5 / 36e5);
                var m = Math.floor(ms % 36e5 / 6e4);
                var s = Math.floor(ms % 6e4 / 1e3);
                var core = pad(h) + ':' + pad(m) + ':' + pad(s);
                return d > 0 ? d + '天 ' + core : core;
            }

            function tick() {
                var now = new Date();
                document.getElementById('dateNow').textContent =
                    now.getFullYear() + '/' + pad(now.getMonth() + 1) + '/' + pad(now.getDate());
                document.getElementById('timeNow').textContent =
                    pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());

                var start = state.start ? new Date(state.start) : null;
                var end = state.end ? new Date(state.end) : null;
                document.getElementById('startAt').textContent = start ? fmtDateTime(start) : '--:--';
                document.getElementById('endAt').textContent = end ? fmtDateTime(end) : '--:--';

                var statusEl = document.getElementById('status');
                var cdEl = document.getElementById('countdown');

                if (!start && !end) {
                    statusEl.textContent = '尚未配置考试时间';
                    cdEl.textContent = '--:--:--';
                } else if (start && now < start) {
                    statusEl.textContent = '距离开考';
                    cdEl.textContent = fmtCountdown(start - now);
                } else if (end && now <= end) {
                    statusEl.textContent = '考试进行中';
                    cdEl.textContent = fmtCountdown(end - now);
                } else {
                    statusEl.textContent = '考试已结束';
                    cdEl.textContent = '00:00:00';
                }
            }

            function applyTypography(t) {
                var root = document.documentElement.style;
                root.setProperty('--fs-subject', t.subject.size + 'px');
                root.setProperty('--c-subject', t.subject.color);
                root.setProperty('--fs-time', t.time.size + 'px');
                root.setProperty('--c-time', t.time.color);
                root.setProperty('--fs-countdown', t.countdown.size + 'px');
                root.setProperty('--c-countdown', t.countdown.color);
            }

            function applyAll() {
                document.getElementById('subject').textContent = state.subject || '未命名科目';
                applyBackground();
                applyTypography(state.typography);
                renderRules();
                tick();
            }

            // ---------- 设置弹窗 ----------
            var modal = document.getElementById('modal');
            var bgPreview = document.getElementById('bgPreview');
            var selectedSwatch = 'slate';

            function renderSwatches() {
                var wrap = document.getElementById('swatches');
                wrap.innerHTML = '';
                Object.keys(GRADIENTS).forEach(function (id) {
                    var b = document.createElement('button');
                    b.type = 'button';
                    b.className = 'swatch' + (draft.background.type === 'gradient' && draft.background.id === id ? ' active' : '');
                    b.style.background = GRADIENTS[id].css;
                    b.title = GRADIENTS[id].name;
                    b.addEventListener('click', function () {
                        draft.background = { type: 'gradient', id: id, image: null };
                        selectedSwatch = id;
                        renderSwatches();
                        bgPreview.hidden = true;
                    });
                    wrap.appendChild(b);
                });
            }

            function openModal() {
                draft = clone(state);
                document.getElementById('fSubject').value = draft.subject;
                document.getElementById('fStart').value = draft.start;
                document.getElementById('fEnd').value = draft.end;
                document.getElementById('fRules').value = draft.rules.join('\n');
                document.getElementById('fShowRules').checked = draft.showRules;
                if (draft.background.type === 'image' && draft.background.image) {
                    bgPreview.hidden = false;
                    bgPreview.style.backgroundImage = 'url("' + draft.background.image + '")';
                } else {
                    bgPreview.hidden = true;
                }
                renderSwatches();
                syncStyleInputs();
                modal.hidden = false;
                document.getElementById('fSubject').focus();
            }

            function closeModal() {
                if (draft) applyTypography(state.typography); // 取消时还原预览
                modal.hidden = true;
                draft = null;
            }

            document.getElementById('btnSettings').addEventListener('click', openModal);
            document.getElementById('btnCancel').addEventListener('click', closeModal);
            modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && !modal.hidden) closeModal();
            });

            document.getElementById('btnClearBg').addEventListener('click', function () {
                draft.background = { type: 'gradient', id: 'slate', image: null };
                renderSwatches();
                bgPreview.hidden = true;
            });

            // ---------- 字体样式调节 ----------
            var STYLE_FIELDS = {
                subject: { size: 'fSubjectSize', value: 'vSubjectSize', color: 'fSubjectColor' },
                time: { size: 'fTimeSize', value: 'vTimeSize', color: 'fTimeColor' },
                countdown: { size: 'fCountSize', value: 'vCountSize', color: 'fCountColor' }
            };

            function syncStyleInputs() {
                Object.keys(STYLE_FIELDS).forEach(function (key) {
                    var f = STYLE_FIELDS[key], t = draft.typography[key];
                    document.getElementById(f.size).value = t.size;
                    document.getElementById(f.value).textContent = t.size + 'px';
                    document.getElementById(f.color).value = t.color;
                });
            }

            function bindStyleInput(key, kind, fieldId) {
                document.getElementById(fieldId).addEventListener('input', function () {
                    draft.typography[key][kind] = kind === 'size' ? Number(this.value) : this.value;
                    if (kind === 'size') {
                        document.getElementById(STYLE_FIELDS[key].value).textContent = this.value + 'px';
                    }
                    applyTypography(draft.typography); // 拖动/取色时实时预览
                });
            }
            Object.keys(STYLE_FIELDS).forEach(function (key) {
                bindStyleInput(key, 'size', STYLE_FIELDS[key].size);
                bindStyleInput(key, 'color', STYLE_FIELDS[key].color);
            });

            document.getElementById('btnResetStyle').addEventListener('click', function () {
                draft.typography = clone(DEFAULT_CONFIG.typography);
                syncStyleInputs();
                applyTypography(draft.typography);
            });

            document.getElementById('btnUpload').addEventListener('click', function () {
                document.getElementById('fImage').click();
            });

            document.getElementById('fImage').addEventListener('change', function () {
                var file = this.files && this.files[0];
                this.value = '';
                if (!file) return;
                var reader = new FileReader();
                reader.onload = function () {
                    var img = new Image();
                    img.onload = function () {
                        draft.background = { type: 'image', id: null, image: scaleImage(img) };
                        bgPreview.hidden = false;
                        bgPreview.style.backgroundImage = 'url("' + draft.background.image + '")';
                    };
                    img.src = reader.result;
                };
                reader.readAsDataURL(file);
            });

            function scaleImage(img) {
                var maxW = 1920, maxH = 1080, q = 0.85;
                var scale = Math.min(1, maxW / img.width, maxH / img.height);
                var canvas = document.createElement('canvas');
                canvas.width = Math.round(img.width * scale);
                canvas.height = Math.round(img.height * scale);
                canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                var url = canvas.toDataURL('image/jpeg', q);
                if (url.length > 3500000) { // 超出时二次压缩，避免撑爆 localStorage
                    canvas.width = Math.round(img.width * scale * 0.66);
                    canvas.height = Math.round(img.height * scale * 0.66);
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    url = canvas.toDataURL('image/jpeg', 0.7);
                }
                return url;
            }

            document.getElementById('btnSave').addEventListener('click', function () {
                state.subject = document.getElementById('fSubject').value.trim() || '考试';
                state.start = document.getElementById('fStart').value;
                state.end = document.getElementById('fEnd').value;
                state.rules = document.getElementById('fRules').value
                    .split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
                state.showRules = document.getElementById('fShowRules').checked;
                state.background = draft.background;
                state.typography = draft.typography;
                persist();
                applyAll();
                closeModal();
                showToast();
            });

            var toastTimer = null;
            function showToast() {
                var t = document.getElementById('toast');
                t.hidden = false;
                clearTimeout(toastTimer);
                toastTimer = setTimeout(function () { t.hidden = true; }, 1800);
            }

            // ---------- 全屏 ----------
            document.getElementById('btnFullscreen').addEventListener('click', function () {
                if (document.fullscreenElement) {
                    document.exitFullscreen();
                } else {
                    document.documentElement.requestFullscreen();
                }
            });
            document.addEventListener('fullscreenchange', function () {
                var on = !!document.fullscreenElement;
                document.getElementById('icoMax').style.display = on ? 'none' : '';
                document.getElementById('icoMin').style.display = on ? '' : 'none';
            });

            applyAll();
            setInterval(tick, 500);
        })();
    </script>
</body>

</html>
